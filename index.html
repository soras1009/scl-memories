<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그땐 그게 유행이었지</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --wall: #EEE4D4;
  --paper: #FDF6E8;
  --ink: #362818;
  --ink-light: #8C7560;
  --accent: #B8692A;
  --border: rgba(150,105,50,0.2);
  --tape: rgba(210,160,55,0.58);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--wall); font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; }

.wall-bg {
  position: fixed; inset: 0; z-index: 0;
  background-color: #C8975A;
  background-image:
    radial-gradient(ellipse at 18% 12%, rgba(255,235,180,0.32) 0%, transparent 45%),
    radial-gradient(ellipse at 82% 88%, rgba(140,80,20,0.18) 0%, transparent 40%),
    repeating-linear-gradient(178deg, transparent 0px, transparent 6px, rgba(150,85,15,0.06) 6px, rgba(150,85,15,0.06) 7px, transparent 7px, transparent 14px, rgba(120,65,10,0.04) 14px, rgba(120,65,10,0.04) 15px),
    repeating-linear-gradient(92deg, transparent 0px, transparent 10px, rgba(180,105,25,0.04) 10px, rgba(180,105,25,0.04) 11px),
    linear-gradient(160deg, #C9935A 0%, #BE8A50 25%, #C49055 50%, #B88248 75%, #C0925A 100%);
}
.wall-bg::after {
  content: ''; position: absolute; inset: 0; opacity: 0.055;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 160px 160px; pointer-events: none;
}

/* HEADER */
.header { position: relative; z-index: 10; text-align: center; padding: 48px 20px 16px; }
.header-eyebrow { font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,240,210,0.75); margin-bottom: 9px; }
.header-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 38px; color: #FDF6E8; line-height: 1; text-shadow: 0 2px 12px rgba(80,40,5,0.35); }
.header-sub { font-size: 12px; color: rgba(255,235,195,0.65); margin-top: 9px; font-weight: 300; letter-spacing: .04em; }
.divider { display: flex; align-items: center; gap: 12px; max-width: 260px; margin: 18px auto 0; }
.dl { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,220,150,.3), transparent); }
.dd { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,220,150,.35); }

/* PICKS */
.picks-section { position: relative; z-index: 10; padding: 32px 20px 8px; max-width: 680px; margin: 0 auto; }
.picks-label { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.picks-label-text { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; font-weight: 400; color: #FDF6E8; letter-spacing: .03em; text-shadow: 0 1px 6px rgba(80,40,5,.3); }
.picks-date { font-size: 10px; color: rgba(255,235,195,.8); letter-spacing: .08em; background: rgba(80,40,5,.22); padding: 3px 9px; border-radius: 20px; border: 0.5px solid rgba(255,210,130,.25); }
.picks-row { display: flex; gap: 20px; justify-content: center; align-items: flex-start; padding-bottom: 8px; flex-wrap: nowrap; overflow-x: auto; }

.pick-card { position: relative; cursor: pointer; flex-shrink: 0; transition: transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s; animation: floatIn .5s cubic-bezier(.2,.8,.3,1) both; }
.pick-card:hover { z-index: 50; box-shadow: 0 22px 52px rgba(110,60,15,.26), 0 7px 18px rgba(110,60,15,.16) !important; transform: scale(1.05) rotate(0deg) !important; }
.pick-frame { background: var(--paper); padding: 9px 9px 14px; box-shadow: 0 6px 22px rgba(110,60,15,.2), 0 2px 7px rgba(110,60,15,.13), inset 0 0 0 .5px rgba(190,155,100,.4); width: 160px; }
.pick-photo { width: 142px; height: 142px; overflow: hidden; position: relative; background: #D8D0C4; display: flex; align-items: center; justify-content: center; }
.pick-photo img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.03) saturate(.85) sepia(.14) brightness(.98); }
.pick-photo::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 22px rgba(80,40,5,.22); pointer-events: none; }
.pick-caption { padding: 9px 3px 0; }
.pick-story { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 300; color: var(--ink); line-height: 1.65; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pick-name { font-size: 9px; color: var(--ink-light); text-align: center; margin-top: 3px; letter-spacing: .04em; font-family: 'Noto Sans KR', sans-serif; }
.pick-footer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(150,105,50,.1); }
.pick-stat { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--ink-light); cursor: pointer; transition: color .15s; }
.pick-stat:hover { color: var(--accent); }
.pick-stat.liked { color: var(--accent); font-weight: 500; }
.pick-stat svg { width: 11px; height: 11px; flex-shrink: 0; }

.tape-pick { position: absolute; top: -8px; left: 50%; transform: translateX(-50%) rotate(-1.5deg); width: 40px; height: 16px; background: var(--tape); border-radius: 1px; z-index: 2; }
.tape-pick::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(255,255,255,.18) 3px,rgba(255,255,255,.18) 4px); border-radius: 1px; }
.pin-pick { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; z-index: 3; box-shadow: 0 2px 5px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.4); }

.picks-divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,210,130,.2), transparent); margin: 28px 0 0; position: relative; z-index: 10; }

/* WALL CONTROLS */
.wall-controls { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 4px; max-width: 680px; margin: 0 auto; }
.wall-controls-label { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; font-weight: 400; color: rgba(255,235,195,.75); }
.shuffle-btn { display: flex; align-items: center; gap: 6px; background: rgba(80,40,5,.2); border: 1px solid rgba(255,210,130,.3); border-radius: 20px; padding: 6px 16px; color: rgba(255,230,180,.75); font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 300; cursor: pointer; transition: all .22s; letter-spacing: .04em; backdrop-filter: blur(4px); }
.shuffle-btn:hover { border-color: rgba(255,220,150,.55); color: rgba(255,245,210,.95); background: rgba(80,40,5,.35); }

/* PHOTO WALL */
.photo-wall { position: relative; z-index: 5; padding: 16px 10px 20px; columns: 3; column-gap: 0; max-width: 720px; margin: 0 auto; }
@media (max-width: 500px) { .photo-wall { columns: 2; } }
.polaroid { position: relative; display: inline-block; width: calc(100% - 16px); margin: 6px 8px; cursor: pointer; break-inside: avoid; transition: transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s; animation: floatIn .5s cubic-bezier(.2,.8,.3,1) both; }
.polaroid:hover { z-index: 100; box-shadow: 0 20px 48px rgba(110,60,15,.24), 0 6px 16px rgba(110,60,15,.14) !important; transform: scale(1.05) rotate(0deg) !important; }
@keyframes floatIn { from { opacity: 0; transform: translateY(16px) scale(.94) rotate(var(--r,0deg)); } to { opacity: 1; transform: translateY(0) scale(1) rotate(var(--r,0deg)); } }
.polaroid-frame { background: var(--paper); padding: 8px 8px 14px; box-shadow: 0 5px 16px rgba(110,60,15,.16), 0 2px 5px rgba(110,60,15,.1), inset 0 0 0 .5px rgba(190,155,100,.36); }
.tape { position: absolute; top: -8px; left: 50%; transform: translateX(-50%) rotate(-1deg); width: 38px; height: 15px; background: var(--tape); border-radius: 1px; z-index: 2; }
.tape::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(255,255,255,.18) 3px,rgba(255,255,255,.18) 4px); border-radius: 1px; }
.pin { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; z-index: 3; box-shadow: 0 2px 5px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.4); }
.p-photo { width: 100%; aspect-ratio: 1; overflow: hidden; position: relative; background: #D8D0C4; display: flex; align-items: center; justify-content: center; }
.p-photo img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.03) saturate(.85) sepia(.14) brightness(.98); }
.p-photo::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 20px rgba(80,40,5,.22); pointer-events: none; }
.p-caption { padding: 7px 3px 0; }
.p-story { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 300; color: var(--ink); line-height: 1.65; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.p-name { font-size: 9px; color: var(--ink-light); text-align: center; margin-top: 3px; letter-spacing: .04em; font-family: 'Noto Sans KR', sans-serif; }
.p-footer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(150,105,50,.1); }
.p-stat { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--ink-light); cursor: pointer; transition: color .15s; }
.p-stat:hover { color: var(--accent); }
.p-stat.liked { color: var(--accent); font-weight: 500; }
.p-stat svg { width: 11px; height: 11px; flex-shrink: 0; }

/* DRAWER */
.drawer-wrap { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; padding: 8px 0 80px; opacity: .65; transition: opacity .2s; }
.drawer-wrap:hover { opacity: .9; }
.drawer-btn { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; padding: 16px 36px 18px; border: none; background: transparent; transition: transform .2s; }
.drawer-btn:hover { transform: translateY(-3px); }
.di { width: 72px; height: 52px; position: relative; }
.di-cap { position: absolute; top: 0; left: -2px; right: -2px; height: 7px; background: linear-gradient(180deg,#D49A50,#B07830); border-radius: 2px 2px 0 0; border: .5px solid rgba(80,40,10,.2); }
.di-body { width: 72px; height: 44px; background: repeating-linear-gradient(91deg,rgba(255,200,80,.07) 0px,rgba(255,200,80,.07) 1px,transparent 1px,transparent 8px), linear-gradient(160deg,#D49A50,#A87030); border-radius: 2px; border: 1px solid rgba(80,40,10,.25); position: absolute; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 5px 8px; }
.di-d { height: 10px; background: rgba(160,90,20,.5); border-radius: 1px; border: .5px solid rgba(60,30,5,.2); display: flex; align-items: center; justify-content: center; }
.di-k { width: 7px; height: 4px; border-radius: 2px; background: radial-gradient(circle at 35% 30%,#D4A060,#8A5020); }
.drawer-label { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 400; color: rgba(255,235,195,.8); letter-spacing: .04em; }

/* DETAIL MODAL */
.backdrop { position: fixed; inset: 0; background: rgba(40,25,10,.52); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .28s; backdrop-filter: blur(3px); padding: 20px; }
.backdrop.open { opacity: 1; pointer-events: all; }
.detail-modal { background: var(--paper); border-radius: 14px; width: 100%; max-width: 400px; max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(80,35,5,.3); transform: scale(.94) translateY(12px); transition: transform .32s cubic-bezier(.2,.8,.3,1); position: relative; }
.backdrop.open .detail-modal { transform: scale(1) translateY(0); }
.detail-photo { width: 100%; overflow: hidden; background: #D8D0C4; display: flex; align-items: center; justify-content: center; border-radius: 14px 14px 0 0; }
.detail-photo img { width: 100%; height: auto; object-fit: contain; filter: contrast(1.04) saturate(.88) sepia(.08); display: block; }
.detail-photo-ph { width: 100%; height: 260px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; color: rgba(255,255,255,.85); }
.detail-body { padding: 20px 22px 24px; }
.detail-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.detail-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.9); flex-shrink: 0; }
.detail-who { flex: 1; }
.detail-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.detail-org { font-size: 10px; color: var(--ink-light); margin-top: 1px; }
.detail-like-btn { display: flex; align-items: center; gap: 4px; background: transparent; border: 1px solid rgba(160,120,60,.2); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: var(--ink-light); cursor: pointer; transition: all .15s; font-family: 'Noto Sans KR', sans-serif; letter-spacing: .03em; }
.detail-like-btn:hover { border-color: var(--accent); color: var(--accent); }
.detail-like-btn.liked { color: var(--accent); border-color: rgba(184,105,42,.4); font-weight: 500; }
.detail-story { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 300; color: var(--ink); line-height: 1.8; margin-bottom: 18px; }
.comments-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-light); opacity: .6; margin-bottom: 12px; }
.comment-item { display: flex; gap: 9px; padding: 10px 0; border-top: 1px solid rgba(160,120,60,.1); }
.c-av { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: rgba(255,255,255,.88); flex-shrink: 0; margin-top: 1px; }
.c-body { flex: 1; }
.c-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
.c-name { font-size: 12px; font-weight: 500; color: var(--ink); }
.c-org { font-size: 10px; color: var(--ink-light); }
.c-time { font-size: 10px; color: var(--ink-light); opacity: .6; margin-left: auto; }
.c-text { font-size: 13px; color: var(--ink); line-height: 1.6; }
.comment-form { margin-top: 14px; border-top: 1px solid rgba(160,120,60,.12); padding-top: 14px; }
.cf-row { display: flex; gap: 7px; margin-bottom: 8px; }
.cf-input { flex: 1; padding: 8px 10px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; border: 1px solid rgba(150,105,50,.45); border-radius: 7px; background: #FDF6E8; color: var(--ink); outline: none; -webkit-appearance: none; transition: border-color .18s; }
.cf-input:focus { border-color: rgba(150,100,40,.7); box-shadow: 0 0 0 2px rgba(180,120,50,.1); }
.cf-input::placeholder { color: rgba(100,80,55,.5); }
.cf-textarea { width: 100%; padding: 9px 10px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; border: 1px solid rgba(150,105,50,.45); border-radius: 7px; background: #FDF6E8; color: var(--ink); outline: none; resize: none; min-height: 60px; line-height: 1.6; margin-bottom: 8px; transition: border-color .18s; }
.cf-textarea:focus { border-color: rgba(150,100,40,.7); }
.cf-textarea::placeholder { color: rgba(100,80,55,.5); }
.cf-submit { width: 100%; padding: 10px; background: var(--ink); color: var(--paper); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; border: none; border-radius: 8px; cursor: pointer; letter-spacing: .04em; transition: background .2s; }
.cf-submit:hover { background: #5A4030; }
.modal-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,252,245,.88); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.14); transition: background .15s; backdrop-filter: blur(4px); }
.modal-close:hover { background: rgba(255,252,245,1); }
.modal-close svg { width: 14px; height: 14px; stroke: var(--ink); stroke-width: 2; }

/* UPLOAD MODAL */
.upload-backdrop { position: fixed; inset: 0; background: rgba(40,25,10,.58); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .28s; backdrop-filter: blur(3px); padding: 20px; }
.upload-backdrop.open { opacity: 1; pointer-events: all; }
.upload-modal { width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; background: var(--paper); border-radius: 16px; padding: 28px 26px 36px; transform: scale(.93) translateY(10px); transition: transform .34s cubic-bezier(.2,.8,.3,1); box-shadow: 0 20px 60px rgba(40,20,5,.35), 0 4px 16px rgba(40,20,5,.2); }
.upload-backdrop.open .upload-modal { transform: scale(1) translateY(0); }
.u-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 21px; font-weight: 300; color: var(--ink); margin-bottom: 18px; text-align: center; }
.u-zone { border: 1.5px dashed rgba(160,110,50,.28); border-radius: 10px; padding: 24px 16px; text-align: center; cursor: pointer; margin-bottom: 14px; background: rgba(240,225,200,.28); transition: all .2s; position: relative; overflow: hidden; }
.u-zone:hover { border-color: rgba(160,110,50,.55); background: rgba(240,225,200,.45); }
.u-zone.has-img { padding: 0; }
.u-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.u-zone img.preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; display: block; filter: sepia(.06) contrast(1.04); }
.u-hint { font-size: 12px; color: var(--ink-light); line-height: 1.6; }
.u-row { display: flex; gap: 7px; margin-bottom: 9px; }
.u-field { flex: 1; padding: 9px 11px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; border: 1px solid rgba(150,105,50,.45); border-radius: 8px; background: #FDF6E8; color: var(--ink); outline: none; -webkit-appearance: none; transition: border-color .18s; }
.u-field:focus { border-color: rgba(150,100,40,.7); box-shadow: 0 0 0 2px rgba(180,120,50,.1); }
.u-field::placeholder { color: rgba(100,75,45,.5); }
.u-story { width: 100%; padding: 9px 11px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; font-weight: 300; border: 1px solid rgba(150,105,50,.45); border-radius: 8px; background: #FDF6E8; color: var(--ink); outline: none; resize: none; min-height: 66px; line-height: 1.65; margin-bottom: 4px; transition: border-color .18s; }
.u-story:focus { border-color: rgba(150,100,40,.7); }
.u-story::placeholder { color: rgba(100,75,45,.38); font-family: 'Noto Sans KR', sans-serif; }
.u-count { font-size: 10px; color: var(--ink-light); text-align: right; margin-bottom: 12px; opacity: .6; }
.u-submit { width: 100%; padding: 12px; background: var(--ink); color: var(--paper); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; border: none; border-radius: 10px; cursor: pointer; letter-spacing: .04em; transition: background .2s; }
.u-submit:hover { background: #5A4030; }

/* FAB */
.fab { position: fixed; bottom: 28px; right: 24px; z-index: 150; display: flex; align-items: center; gap: 9px; background: var(--ink); color: var(--paper); border: none; border-radius: 50px; padding: 13px 22px 13px 18px; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 400; letter-spacing: .04em; cursor: pointer; box-shadow: 0 6px 24px rgba(80,40,8,.32), 0 2px 8px rgba(80,40,8,.18); transition: transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, background .18s; overflow: hidden; }
.fab:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 32px rgba(80,40,8,.38), 0 4px 12px rgba(80,40,8,.22); background: #5A3E24; }
.fab:active { transform: scale(.97); }
.fab-icon { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; line-height: 1; }
.fab-pulse { position: absolute; inset: 0; border-radius: 50px; animation: fabPulse 2.2s ease-out 0.8s 2; pointer-events: none; }
@keyframes fabPulse { 0%{box-shadow:0 0 0 0 rgba(54,40,24,.4);}70%{box-shadow:0 0 0 14px rgba(54,40,24,0);}100%{box-shadow:0 0 0 0 rgba(54,40,24,0);} }

/* TOAST */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(14px); background: var(--ink); color: var(--paper); padding: 9px 20px; border-radius: 24px; font-size: 13px; font-weight: 300; letter-spacing: .04em; opacity: 0; transition: all .3s; z-index: 500; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.placeholder-icon { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div class="wall-bg"></div>

<div class="header">
  <div class="header-eyebrow">삼천리그룹 임직원 플랫폼</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot, increment } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const firebaseConfig = {
  apiKey: "AIzaSyDKRKc9oiB_Qz5ilI5M0BMew2T_MOBnUlI",
  authDomain: "scl-memories.firebaseapp.com",
  projectId: "scl-memories",
  storageBucket: "scl-memories.firebasestorage.app",
  messagingSenderId: "92047921392",
  appId: "1:92047921392:web:47ddcbea906837b93ef235"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const storage = getStorage(app);

const ROTS  = [-4.5,2.8,-1.8,5.2,-3.2,1.5,-5.8,3.6,-2.4,4.1,-3.8,2.2,-1.2,4.8,-2.9,1.8];
const TAPES = [true,false,true,true,false,true,false,true,true,false,true,false,true,false,true,true];
const PINS  = ['#C0392B','#2471A3','#1E8449','#D4AC0D','#7D3C98','#CA6F1E'];
const BGS   = ['linear-gradient(135deg,#D8C8A8,#C4B090)','linear-gradient(135deg,#C0C8C8,#A8B8B8)','linear-gradient(135deg,#C4CCA8,#B0BC90)','linear-gradient(135deg,#D0C0A8,#BCA890)','linear-gradient(135deg,#C8C4B4,#B4B0A0)','linear-gradient(135deg,#CCC0B8,#B8ACA4)','linear-gradient(135deg,#D0C4A0,#BCB088)','linear-gradient(135deg,#C4BCAC,#B0A898)','linear-gradient(135deg,#CCB4A8,#B8A094)','linear-gradient(135deg,#BCC8B4,#A8B4A0)'];
const AV_COLS = ['#9E7248','#527A8A','#528A62','#9A7E38','#785290','#9A5C2E','#3A7878','#825270','#5A8248','#6A5E98'];

let posts    = [];
let activeId = null;
let likedIds = JSON.parse(localStorage.getItem('liked_v4') || '[]');

function saveLiked(){ try{ localStorage.setItem('liked_v4', JSON.stringify(likedIds)); }catch(e){} }
function isLiked(id){ return likedIds.includes(String(id)); }
function initials(n){ return n || '?'; }
function avCol(id){ return AV_COLS[Math.abs(String(id).split('').reduce((a,c)=>a+c.charCodeAt(0),0)) % AV_COLS.length]; }

function timeAgo(ts){
  const d = Date.now() - Number(ts);
  if(d < 60000)    return '방금 전';
  if(d < 3600000)  return Math.floor(d/60000)+'분 전';
  if(d < 86400000) return Math.floor(d/3600000)+'시간 전';
  return Math.floor(d/86400000)+'일 전';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function showLoading(on){
  let el = document.getElementById('loadingMsg');
  if(on){
    if(!el){
      el = document.createElement('div');
      el.id = 'loadingMsg';
      el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(253,246,232,.95);padding:20px 32px;border-radius:12px;font-size:14px;color:#362818;z-index:9999;box-shadow:0 8px 32px rgba(80,40,5,.2);font-family:Noto Sans KR,sans-serif;';
      el.textContent = '추억을 불러오는 중...';
      document.body.appendChild(el);
    }
  } else {
    if(el) el.remove();
  }
}

/* ── LOAD POSTS (실시간) ── */
function initRealtime(){
  showLoading(true);
  const q = query(collection(db, 'posts'), orderBy('ts', 'desc'));
  onSnapshot(q, snap => {
    posts = snap.docs.map(d => ({ id: d.id, ...d.data(), liked: isLiked(d.id), bg: Math.abs(String(d.id).charCodeAt(0)) % BGS.length }));
    showLoading(false);
    renderPicks();
    renderWall(getWallPosts());
    document.getElementById('wallCountLabel').textContent = `전체 ${posts.length}개의 추억`;
  });
}

/* ── PICKS ── */
function renderPicks(){
  const shuffled = [...posts].sort(()=>Math.random()-.5);
  const picks = shuffled.slice(0,3);
  const rots  = [-3.5,1.8,-2.2];
  const row   = document.getElementById('picksRow');
  row.innerHTML = '';
  if(picks.length === 0){
    row.innerHTML = '<div style="font-size:13px;color:rgba(255,235,195,.6);font-family:Noto Sans KR,sans-serif;padding:20px 0;">아직 올라온 추억이 없어요!</div>';
    return;
  }
  picks.forEach((p,i)=>{
    const useTape = [true,false,true][i];
    const pinCol  = PINS[Math.abs(String(p.id).charCodeAt(0)) % PINS.length];
    const el = document.createElement('div');
    el.className = 'pick-card';
    el.style.setProperty('--r', rots[i]+'deg');
    el.style.transform = `rotate(${rots[i]}deg)`;
    el.style.animationDelay = (i*.1)+'s';
    el.innerHTML = `
      ${useTape ? `<div class="tape-pick"></div>` : `<div class="pin-pick" style="background:radial-gradient(circle at 35% 30%,${pinCol}dd,${pinCol}77);"></div>`}
      <div class="pick-frame">
        <div class="pick-photo">
          ${p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : `<div class="placeholder-icon" style="background:${BGS[p.bg]};width:100%;height:100%;"><span style="background:${avCol(p.id)};width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(255,255,255,.9);">${initials(p.name)}</span></div>`}
        </div>
        <div class="pick-caption">
          <div class="pick-story">${p.story||''}</div>
          <div class="pick-name">${p.name||''} · ${p.company||''}</div>
          <div class="pick-footer">
            <div class="pick-stat ${p.liked?'liked':''}" id="plk-${p.id}">공감 ${p.likes||0}</div>
            <div class="pick-stat" id="pcm-${p.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              댓글
            </div>
          </div>
        </div>
      </div>`;
    el.addEventListener('click', e => { if(e.target.closest(`#plk-${p.id}`)||e.target.closest(`#pcm-${p.id}`)) return; openDetail(p.id); });
    el.querySelector(`#plk-${p.id}`).addEventListener('click', e => { e.stopPropagation(); toggleLike(p.id); });
    el.querySelector(`#pcm-${p.id}`).addEventListener('click', e => { e.stopPropagation(); openDetail(p.id); });
    row.appendChild(el);
  });
}

/* ── WALL ── */
function getWallPosts(){ return [...posts].sort(()=>Math.random()-.5).slice(0, Math.min(posts.length,12)); }

function renderWall(items){
  const wall = document.getElementById('photoWall');
  wall.innerHTML = '';
  if(items.length===0){ wall.innerHTML='<div style="text-align:center;padding:40px;color:rgba(255,235,195,.5);font-family:Noto Sans KR,sans-serif;font-size:13px;column-span:all;">첫 번째 유행을 꺼내보세요!</div>'; return; }
  items.forEach((p,i)=>wall.appendChild(makePolaroid(p,i)));
}

function makePolaroid(p,idx){
  const rot=ROTS[idx%ROTS.length], useTape=TAPES[idx%TAPES.length];
  const pinCol=PINS[Math.abs(String(p.id).charCodeAt(0))%PINS.length];
  const el=document.createElement('div');
  el.className='polaroid'; el.dataset.id=p.id;
  el.style.setProperty('--r',rot+'deg');
  el.style.transform=`rotate(${rot}deg)`;
  el.style.animationDelay=(idx*.06)+'s';
  el.innerHTML=`
    ${useTape ? `<div class="tape"></div>` : `<div class="pin" style="background:radial-gradient(circle at 35% 30%,${pinCol}dd,${pinCol}77);"></div>`}
    <div class="polaroid-frame">
      <div class="p-photo">
        ${p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : `<div class="placeholder-icon" style="background:${BGS[p.bg]};width:100%;height:100%;"><span style="background:${avCol(p.id)};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.9);">${initials(p.name)}</span></div>`}
      </div>
      <div class="p-caption">
        <div class="p-story">${p.story||''}</div>
        <div class="p-name">${p.name||''} · ${p.company||''}${p.team?' · '+p.team:''}</div>
        <div class="p-footer">
          <div class="p-stat ${p.liked?'liked':''}" id="like-${p.id}">공감 ${p.likes||0}</div>
          <div class="p-stat" id="cmt-${p.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            댓글
          </div>
        </div>
      </div>
    </div>`;
  el.addEventListener('click', e => { if(e.target.closest(`#like-${p.id}`)||e.target.closest(`#cmt-${p.id}`)) return; openDetail(p.id); });
  el.querySelector(`#like-${p.id}`).addEventListener('click', e => { e.stopPropagation(); toggleLike(p.id); });
  el.querySelector(`#cmt-${p.id}`).addEventListener('click', e => { e.stopPropagation(); openDetail(p.id); });
  return el;
}

/* ── LIKE ── */
async function toggleLike(id){
  const p = posts.find(x=>x.id===id); if(!p) return;
  p.liked = !p.liked;
  p.likes = Math.max(0, (Number(p.likes)||0) + (p.liked?1:-1));
  if(p.liked) likedIds.push(String(id));
  else likedIds = likedIds.filter(x=>x!==String(id));
  saveLiked();
  renderPicks(); renderWall(getWallPosts());
  try { await updateDoc(doc(db,'posts',id), { likes: increment(p.liked?1:-1) }); } catch(e){}
}

/* ── SHUFFLE ── */
document.getElementById('shuffleBtn').addEventListener('click',()=>{
  const wall=document.getElementById('photoWall');
  wall.style.transition='opacity .22s'; wall.style.opacity='0';
  setTimeout(()=>{ renderWall(getWallPosts()); wall.style.opacity='1'; },230);
});

/* ── DETAIL ── */
async function openDetail(id){
  activeId = id;
  const p = posts.find(x=>x.id===id); if(!p) return;

  document.getElementById('detailPhoto').innerHTML = p.imageUrl
    ? `<img src="${p.imageUrl}" alt="">`
    : `<div class="detail-photo-ph" style="background:${BGS[p.bg]};width:100%;height:100%;"><span style="background:${avCol(p.id)};width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,.9);">${initials(p.name)}</span></div>`;

  const myName = localStorage.getItem('my_name')||'';
  const myTeam = localStorage.getItem('my_team')||'';
  const isOwner = myName && myTeam && p.name===myName && p.team===myTeam;

  document.getElementById('detailMeta').innerHTML = `
    <div class="detail-avatar" style="background:${avCol(p.id)};">${initials(p.name)}</div>
    <div class="detail-who">
      <div class="detail-name">${p.name||''}</div>
      <div class="detail-org">${p.company||''}${p.team?' · '+p.team:''} · ${timeAgo(p.ts)}</div>
    </div>
    <button class="detail-like-btn ${p.liked?'liked':''}" id="detailLikeBtn">공감 ${p.likes||0}</button>`;

  document.getElementById('detailLikeBtn').addEventListener('click',()=>{ toggleLike(p.id); openDetail(p.id); });

  const ownerBtns = document.getElementById('ownerBtns');
  if(isOwner){
    ownerBtns.style.display='flex';
    ownerBtns.innerHTML=`
      <button id="editPostBtn" style="padding:6px 14px;background:transparent;border:1px solid rgba(150,105,50,.3);border-radius:6px;font-size:12px;color:var(--ink-light);cursor:pointer;font-family:'Noto Sans KR',sans-serif;">수정</button>
      <button id="deletePostBtn" style="padding:6px 14px;background:transparent;border:1px solid rgba(184,64,64,.3);border-radius:6px;font-size:12px;color:#B84040;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">삭제</button>`;
    document.getElementById('editPostBtn').addEventListener('click',()=>editPost(p));
    document.getElementById('deletePostBtn').addEventListener('click',()=>deletePost(p.id));
  } else {
    ownerBtns.style.display='none'; ownerBtns.innerHTML='';
  }

  document.getElementById('detailStory').textContent = p.story||'';
  document.getElementById('commentsList').innerHTML = '<div style="font-size:12px;color:var(--ink-light);padding:8px 0;">댓글 불러오는 중...</div>';
  document.getElementById('detailBackdrop').classList.add('open');

  try {
    const snap = await getDocs(query(collection(db,'posts',id,'comments'), orderBy('ts','asc')));
    const comments = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderComments(comments);
  } catch(e){ renderComments([]); }
}

function renderComments(comments){
  const list = document.getElementById('commentsList');
  if(!comments||comments.length===0){
    list.innerHTML='<div style="font-size:12px;color:var(--ink-light);opacity:.5;padding:8px 0 4px;">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</div>';
    return;
  }
  list.innerHTML = comments.map((c,i)=>`
    <div class="comment-item">
      <div class="c-av" style="background:${AV_COLS[i%AV_COLS.length]};">${initials(c.name)}</div>
      <div class="c-body">
        <div class="c-header">
          <span class="c-name">${c.name||''}</span>
          <span class="c-org">${c.company||''}${c.team?' · '+c.team:''}</span>
          <span class="c-time">${timeAgo(c.ts)}</span>
        </div>
        <div class="c-text">${c.text||''}</div>
      </div>
    </div>`).join('');
}

document.getElementById('cf-submit').addEventListener('click', async()=>{
  const name=document.getElementById('cf-name').value.trim();
  const company=document.getElementById('cf-company').value.trim();
  const team=document.getElementById('cf-team').value.trim();
  const text=document.getElementById('cf-text').value.trim();
  if(!name||!company||!team||!text){ alert('이름, 소속회사, 팀명, 댓글을 모두 입력해주세요.'); return; }
  const btn=document.getElementById('cf-submit');
  btn.textContent='저장 중...'; btn.disabled=true;
  try {
    await addDoc(collection(db,'posts',activeId,'comments'), { name,company,team,text,ts:Date.now() });
    document.getElementById('cf-name').value='';
    document.getElementById('cf-company').value='';
    document.getElementById('cf-team').value='';
    document.getElementById('cf-text').value='';
    const snap = await getDocs(query(collection(db,'posts',activeId,'comments'), orderBy('ts','asc')));
    renderComments(snap.docs.map(d=>({id:d.id,...d.data()})));
    showToast('댓글이 달렸어요 ✦');
  } catch(e){ alert('댓글 저장 중 오류가 발생했어요.'); }
  btn.textContent='댓글 달기'; btn.disabled=false;
});

document.getElementById('detailClose').addEventListener('click',()=>document.getElementById('detailBackdrop').classList.remove('open'));
document.getElementById('detailBackdrop').addEventListener('click',e=>{ if(e.target===document.getElementById('detailBackdrop')) document.getElementById('detailBackdrop').classList.remove('open'); });

/* ── EDIT / DELETE ── */
async function editPost(p){
  const newStory = prompt('이야기를 수정해주세요:', p.story);
  if(!newStory||newStory.trim()===p.story) return;
  await updateDoc(doc(db,'posts',p.id), { story: newStory.trim() });
  showToast('수정됐어요 ✦');
  document.getElementById('detailBackdrop').classList.remove('open');
}
async function deletePost(id){
  if(!confirm('이 게시글을 삭제할까요?')) return;
  await deleteDoc(doc(db,'posts',id));
  document.getElementById('detailBackdrop').classList.remove('open');
  showToast('삭제됐어요.');
}

/* ── UPLOAD ── */
let selectedFile = null;
document.getElementById('openUpload').addEventListener('click',()=>document.getElementById('uploadBackdrop').classList.add('open'));
document.getElementById('fabBtn').addEventListener('click',()=>document.getElementById('uploadBackdrop').classList.add('open'));
document.getElementById('uploadBackdrop').addEventListener('click',e=>{ if(e.target===document.getElementById('uploadBackdrop')) document.getElementById('uploadBackdrop').classList.remove('open'); });

function handleUFile(e){
  const f=e.target.files[0]; if(!f) return;
  selectedFile=f;
  const r=new FileReader();
  r.onload=ev=>{
    const zone=document.getElementById('uZone');
    zone.classList.add('has-img');
    zone.innerHTML=`<input type="file" id="uFile" accept="image/*"><img class="preview" src="${ev.target.result}">`;
    document.getElementById('uFile').addEventListener('change',handleUFile);
  };
  r.readAsDataURL(f);
}
document.getElementById('uFile').addEventListener('change',handleUFile);

document.getElementById('uSubmit').addEventListener('click', async()=>{
  const name=document.getElementById('u-name').value.trim();
  const company=document.getElementById('u-company').value.trim();
  const team=document.getElementById('u-team').value.trim();
  const story=document.getElementById('u-story').value.trim();
  if(!name||!company||!team||!story){ alert('이름, 소속회사, 팀명, 이야기를 모두 입력해주세요.'); return; }

  const btn=document.getElementById('uSubmit');
  btn.textContent='올리는 중...'; btn.disabled=true;

  try {
    let imageUrl='';
    if(selectedFile){
      const storageRef=ref(storage,`photos/${Date.now()}_${selectedFile.name}`);
      await uploadBytes(storageRef, selectedFile);
      imageUrl=await getDownloadURL(storageRef);
    }
    await addDoc(collection(db,'posts'), { name,company,team,story,imageUrl,likes:0,ts:Date.now() });
    localStorage.setItem('my_name',name);
    localStorage.setItem('my_team',team);

    document.getElementById('uploadBackdrop').classList.remove('open');
    selectedFile=null;
    document.getElementById('u-name').value='';
    document.getElementById('u-company').value='';
    document.getElementById('u-team').value='';
    document.getElementById('u-story').value='';
    document.getElementById('uCount').textContent='0';
    const zone=document.getElementById('uZone');
    zone.classList.remove('has-img');
    zone.innerHTML=`<input type="file" id="uFile" accept="image/*"><div id="uPlaceholder"><svg style="margin:0 auto 8px;display:block;opacity:.35;" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(120,85,45,1)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><div class="u-hint">사진을 클릭하거나 끌어다 놓으세요</div></div>`;
    document.getElementById('uFile').addEventListener('change',handleUFile);
    showToast('유행이 벽에 붙었어요 ✦');
  } catch(e){ alert('저장 중 오류가 발생했어요: '+e.message); }
  btn.textContent='벽에 붙이기'; btn.disabled=false;
});

/* ── INIT ── */
initRealtime();
</script>
</body>
</html>
