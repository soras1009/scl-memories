<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · 그땐 그게 유행이었지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F5F0E8; font-family: 'Noto Sans KR', sans-serif; color: #3A2E24; min-height: 100vh; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-box { background: #FDFAF5; border-radius: 14px; padding: 36px 32px; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(80,40,5,.14); border: 1px solid rgba(150,105,50,.18); }
.login-title { font-size: 20px; font-weight: 500; margin-bottom: 6px; }
.login-sub { font-size: 12px; color: #8A7A6A; margin-bottom: 24px; }
.login-input { width: 100%; padding: 10px 14px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; border: 1px solid rgba(150,105,50,.35); border-radius: 8px; background: #FDF6E8; color: #3A2E24; outline: none; margin-bottom: 12px; }
.login-input:focus { border-color: rgba(150,100,40,.6); }
.login-btn { width: 100%; padding: 11px; background: #3A2E24; color: #FDF6E8; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; }
.login-btn:hover { background: #5A4030; }
.login-err { font-size: 12px; color: #B84040; margin-top: 8px; display: none; }
.admin-wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
.admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid rgba(150,105,50,.2); }
.admin-title { font-size: 18px; font-weight: 500; }
.admin-sub { font-size: 12px; color: #8A7A6A; margin-top: 3px; }
.logout-btn { padding: 7px 16px; background: transparent; border: 1px solid rgba(150,105,50,.3); border-radius: 20px; font-size: 12px; color: #8A7A6A; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.logout-btn:hover { border-color: #B84040; color: #B84040; }
.stats-row { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 120px; background: #FDFAF5; border-radius: 10px; padding: 16px 18px; border: 1px solid rgba(150,105,50,.15); }
.stat-label { font-size: 11px; color: #8A7A6A; letter-spacing: .06em; margin-bottom: 6px; }
.stat-num { font-size: 26px; font-weight: 500; }
.section-label { font-size: 13px; font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.refresh-btn { font-size: 11px; color: #8A7A6A; background: none; border: 1px solid rgba(150,105,50,.2); border-radius: 6px; cursor: pointer; padding: 4px 8px; font-family: 'Noto Sans KR', sans-serif; }
.table-wrap { overflow-x: auto; margin-bottom: 36px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { background: rgba(150,105,50,.08); }
th { padding: 10px 12px; text-align: left; font-weight: 500; font-size: 11px; letter-spacing: .06em; color: #8A7A6A; border-bottom: 1px solid rgba(150,105,50,.15); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid rgba(150,105,50,.08); vertical-align: middle; }
tr:hover td { background: rgba(150,105,50,.04); }
.post-story { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post-img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; }
.no-img { width: 44px; height: 44px; border-radius: 4px; background: #E8DDD0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #8A7A6A; }
.btn-del { padding: 4px 10px; background: transparent; border: 1px solid rgba(184,64,64,.35); border-radius: 6px; font-size: 11px; color: #B84040; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.btn-del:hover { background: rgba(184,64,64,.08); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; background: rgba(150,105,50,.12); color: #8A7A6A; }
.loading-row td { text-align: center; color: #8A7A6A; padding: 24px; }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(14px); background: #3A2E24; color: #FDF6E8; padding: 9px 20px; border-radius: 24px; font-size: 13px; opacity: 0; transition: all .3s; z-index: 999; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-title">관리자 페이지</div>
    <div class="login-sub">그땐 그게 유행이었지 · 삼천리그룹</div>
    <input class="login-input" type="password" id="pwInput" placeholder="비밀번호" />
    <button class="login-btn" id="loginBtn">로그인</button>
    <div class="login-err" id="loginErr">비밀번호가 맞지 않아요.</div>
  </div>
</div>

<div class="admin-wrap" id="adminWrap" style="display:none;">
  <div class="admin-header">
    <div>
      <div class="admin-title">관리자 대시보드</div>
      <div class="admin-sub">그땐 그게 유행이었지 · 삼천리그룹</div>
    </div>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">전체 게시글</div><div class="stat-num" id="statPosts">-</div></div>
    <div class="stat-card"><div class="stat-label">전체 댓글</div><div class="stat-num" id="statComments">-</div></div>
    <div class="stat-card"><div class="stat-label">전체 공감</div><div class="stat-num" id="statLikes">-</div></div>
    <div class="stat-card"><div class="stat-label">참여 인원</div><div class="stat-num" id="statPeople">-</div></div>
  </div>
  <div class="section-label">게시글 관리 <button class="refresh-btn" id="refreshBtn">↻ 새로고침</button></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>사진</th><th>이름</th><th>소속</th><th>이야기</th><th>공감</th><th>등록일</th><th>관리</th></tr></thead>
      <tbody id="postsTable"><tr class="loading-row"><td colspan="7">불러오는 중...</td></tr></tbody>
    </table>
  </div>
  <div class="section-label">댓글 관리</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>이름</th><th>소속</th><th>댓글 내용</th><th>등록일</th><th>관리</th></tr></thead>
      <tbody id="commentsTable"><tr class="loading-row"><td colspan="5">불러오는 중...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const ADMIN_PW = 'scl2024!';
const firebaseConfig = {
  apiKey: "AIzaSyDKRKc9oiB_Qz5ilI5M0BMew2T_MOBnUlI",
  authDomain: "scl-memories.firebaseapp.com",
  projectId: "scl-memories",
  storageBucket: "scl-memories.firebasestorage.app",
  messagingSenderId: "92047921392",
  appId: "1:92047921392:web:47ddcbea906837b93ef235"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let allPosts=[], allComments=[];

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function timeStr(ts){ if(!ts) return '-'; const d=new Date(Number(ts)); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

document.getElementById('loginBtn').addEventListener('click',()=>{
  if(document.getElementById('pwInput').value===ADMIN_PW){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('adminWrap').style.display='';
    loadAll();
  } else {
    document.getElementById('loginErr').style.display='block';
  }
});
document.getElementById('pwInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
document.getElementById('logoutBtn').addEventListener('click',()=>{
  document.getElementById('adminWrap').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('pwInput').value='';
});
document.getElementById('refreshBtn').addEventListener('click',()=>loadAll());

async function loadAll(){
  document.getElementById('postsTable').innerHTML='<tr class="loading-row"><td colspan="7">불러오는 중...</td></tr>';
  document.getElementById('commentsTable').innerHTML='<tr class="loading-row"><td colspan="5">불러오는 중...</td></tr>';
  const snap=await getDocs(query(collection(db,'posts'),orderBy('ts','desc')));
  allPosts=snap.docs.map(d=>({id:d.id,...d.data()}));
  allComments=[];
  for(const p of allPosts){
    const cs=await getDocs(query(collection(db,'posts',p.id,'comments'),orderBy('ts','desc')));
    cs.docs.forEach(d=>allComments.push({id:d.id,postId:p.id,...d.data()}));
  }
  const people=new Set(allPosts.map(p=>p.name+p.team)).size;
  const likes=allPosts.reduce((s,p)=>s+Number(p.likes||0),0);
  document.getElementById('statPosts').textContent=allPosts.length;
  document.getElementById('statComments').textContent=allComments.length;
  document.getElementById('statLikes').textContent=likes;
  document.getElementById('statPeople').textContent=people;
  renderPostsTable(); renderCommentsTable();
}

function renderPostsTable(){
  const tbody=document.getElementById('postsTable');
  if(!allPosts.length){ tbody.innerHTML='<tr class="loading-row"><td colspan="7">게시글이 없어요.</td></tr>'; return; }
  tbody.innerHTML=allPosts.map(p=>`<tr>
    <td>${p.imageUrl?`<img class="post-img" src="${p.imageUrl}">`:`<div class="no-img">없음</div>`}</td>
    <td>${p.name||''}</td>
    <td><span class="badge">${p.company||''}</span><br><span style="font-size:11px;color:#8A7A6A;">${p.team||''}</span></td>
    <td><div class="post-story">${p.story||''}</div></td>
    <td>${p.likes||0}</td>
    <td style="font-size:11px;color:#8A7A6A;">${timeStr(p.ts)}</td>
    <td><button class="btn-del" onclick="window._delPost('${p.id}','${(p.name||'').replace(/'/g,'\\'')}')">삭제</button></td>
  </tr>`).join('');
}

function renderCommentsTable(){
  const tbody=document.getElementById('commentsTable');
  if(!allComments.length){ tbody.innerHTML='<tr class="loading-row"><td colspan="5">댓글이 없어요.</td></tr>'; return; }
  tbody.innerHTML=allComments.map(c=>`<tr>
    <td>${c.name||''}</td>
    <td><span class="badge">${c.company||''}</span> ${c.team||''}</td>
    <td style="max-width:280px;">${c.text||''}</td>
    <td style="font-size:11px;color:#8A7A6A;">${timeStr(c.ts)}</td>
    <td><button class="btn-del" onclick="window._delComment('${c.postId}','${c.id}')">삭제</button></td>
  </tr>`).join('');
}

window._delPost=async(postId,name)=>{
  if(!confirm(`"${name}"님의 게시글을 삭제할까요?\n연결된 댓글도 함께 삭제됩니다.`)) return;
  const cs=await getDocs(collection(db,'posts',postId,'comments'));
  for(const d of cs.docs) await deleteDoc(doc(db,'posts',postId,'comments',d.id));
  await deleteDoc(doc(db,'posts',postId));
  showToast('게시글을 삭제했어요.'); await loadAll();
};
window._delComment=async(postId,commentId)=>{
  if(!confirm('이 댓글을 삭제할까요?')) return;
  await deleteDoc(doc(db,'posts',postId,'comments',commentId));
  showToast('댓글을 삭제했어요.'); await loadAll();
};
</script>
</body>
</html>
